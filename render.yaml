# One-click deploy on Render (render.com → New → Blueprint → this repo)
databases:
  - name: faker-db
    plan: free
    databaseName: faker
services:
  - type: web
    name: sql-faker
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: faker-db, property: connectionString }
      - key: INIT_DB
        value: "1"
