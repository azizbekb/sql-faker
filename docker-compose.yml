services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: faker
      POSTGRES_USER: faker
      POSTGRES_PASSWORD: faker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faker -d faker"]
      interval: 2s
      retries: 30
  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://faker:faker@db:5432/faker
      INIT_DB: "1"
    ports:
      - "8000:8000"
